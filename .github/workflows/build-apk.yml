name: Build Debug APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Check repository
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Repository ==="
          pwd

          echo "=== Files ==="
          ls -lah

          ZIP_FILE="$GITHUB_WORKSPACE/AI-Video-Studio-v1.zip"

          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "::error::AI-Video-Studio-v1.zip was not found in repository root."
            echo "Available files:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -print | sort | head -300
            exit 1
          fi

          echo "ZIP found:"
          ls -lh "$ZIP_FILE"

          echo "=== ZIP contents ==="
          unzip -l "$ZIP_FILE" | head -200

      - name: Extract Android project
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/project"
          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -q -o \
            "$GITHUB_WORKSPACE/AI-Video-Studio-v1.zip" \
            -d "$GITHUB_WORKSPACE/project"

          echo "=== Extracted files ==="
          find "$GITHUB_WORKSPACE/project" \
            -maxdepth 6 \
            -type f \
            -print \
            | sort \
            | head -300

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$GITHUB_WORKSPACE/project"

          SETTINGS_FILE=""

          while IFS= read -r file; do
            candidate_dir="$(dirname "$file")"

            if [[ -f "$candidate_dir/app/build.gradle.kts" ]] || \
               [[ -f "$candidate_dir/app/build.gradle" ]]; then
              SETTINGS_FILE="$file"
              break
            fi
          done < <(
            find "$PROJECT_ROOT" \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print \
              | sort
          )

          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "::error::Could not find the Android Gradle project."

            echo "=== settings files ==="
            find "$PROJECT_ROOT" \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print \
              | sort

            echo "=== app Gradle files ==="
            find "$PROJECT_ROOT" \
              -type f \
              \( -path "*/app/build.gradle" -o -path "*/app/build.gradle.kts" \) \
              -print \
              | sort

            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Show Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "=== PROJECT_DIR ==="
          echo "$PROJECT_DIR"

          echo "=== Project files ==="
          cd "$PROJECT_DIR"

          pwd
          ls -lah

          echo "=== Gradle files ==="
          find . \
            -maxdepth 5 \
            -type f \
            \( \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "gradle.properties" \
            \) \
            -print \
            | sort

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [[ -z "$SDK_DIR" ]]; then
            echo "::error::ANDROID_SDK_ROOT/ANDROID_HOME is not available."
            exit 1
          fi

          echo "sdk.dir=$SDK_DIR" > local.properties

          echo "=== local.properties ==="
          cat local.properties

          touch gradle.properties

          if ! grep -q '^android.builder.sdkDownload=true$' gradle.properties; then
            printf '\nandroid.builder.sdkDownload=true\n' >> gradle.properties
          fi

          if ! grep -q '^kotlin.jvm.target.validation.mode=' gradle.properties; then
            printf 'kotlin.jvm.target.validation.mode=error\n' >> gradle.properties
          fi

          echo "=== gradle.properties ==="
          cat gradle.properties

      - name: Force Java 17 compatibility
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/ci-jvm17.init.gradle" <<'EOF'
          import org.gradle.api.tasks.compile.JavaCompile

          gradle.projectsEvaluated {
              allprojects { project ->

                  project.tasks.withType(JavaCompile).configureEach {
                      sourceCompatibility = "17"
                      targetCompatibility = "17"
                  }

              }
          }
          EOF

          echo "=== CI Gradle init script ==="
          cat "$RUNNER_TEMP/ci-jvm17.init.gradle"

      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [[ -f "./gradlew" ]]; then
            chmod +x ./gradlew
            ./gradlew --version
          else
            gradle --version
          fi

      - name: Check Android module
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [[ ! -f "app/build.gradle.kts" ]] && \
             [[ ! -f "app/build.gradle" ]]; then
            echo "::error::app Gradle module was not found."
            find . -maxdepth 5 -type f | sort | head -300
            exit 1
          fi

          echo "=== Android app module ==="
          ls -lah app

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=== Java ==="
          java -version

          echo "=== Gradle ==="
          if [[ -f "./gradlew" ]]; then
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi

          $GRADLE_CMD --version

          echo "=== Building Debug APK ==="

          $GRADLE_CMD \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --init-script "$RUNNER_TEMP/ci-jvm17.init.gradle" \
            :app:assembleDebug

      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=== APK files ==="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print \
            | sort

          APK_COUNT="$(
            find app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              | wc -l
          )"

          if [[ "$APK_COUNT" -eq 0 ]]; then
            echo "::error::No APK was generated."

            echo "=== Build outputs ==="
            find app/build/outputs \
              -maxdepth 6 \
              -type f \
              -print \
              | sort \
              | head -300

            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/apk-output"
          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -exec cp -v {} "$GITHUB_WORKSPACE/apk-output/" \;

          echo "=== Final APK files ==="
          ls -lah "$GITHUB_WORKSPACE/apk-output"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Studio-Debug-APK
          path: apk-output
          if-no-files-found: error
          retention-days: 14
