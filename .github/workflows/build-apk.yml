name: Build Android APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Check repository
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Repository files ==="
          ls -lah

          ZIP_FILE="AI-Video-Studio-v1.zip"

          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "::error::$ZIP_FILE was not found."
            echo "=== Available ZIP files ==="
            find . -maxdepth 3 -type f -iname '*.zip' -print | sort
            exit 1
          fi

          echo "Found: $ZIP_FILE"

          echo "=== ZIP contents ==="
          unzip -l "$ZIP_FILE" | sed -n '1,160p'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project
          mkdir -p project

          unzip -oq "AI-Video-Studio-v1.zip" -d project

          echo "=== Extracted files ==="
          find project -maxdepth 8 -type f -print | sort | sed -n '1,300p'

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          while IFS= read -r settings_file; do
            PROJECT_DIR="$(dirname "$settings_file")"
            break
          done < <(
            find project -type f \
              \( \
                -name 'settings.gradle' \
                -o -name 'settings.gradle.kts' \
              \) \
              -print | sort
          )

          if [[ -z "$PROJECT_DIR" ]]; then
            while IFS= read -r build_file; do
              PROJECT_DIR="$(dirname "$build_file")"
              break
            done < <(
              find project -type f \
                \( \
                  -name 'build.gradle' \
                  -o -name 'build.gradle.kts' \
                \) \
                -print | sort
            )
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::Android Gradle project was not found inside the ZIP."
            find project -maxdepth 10 -print | sort
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Project directory ==="
          pwd

          echo "=== Project files ==="
          find . -maxdepth 8 -type f -print | sort | sed -n '1,300p'

          echo "=== Gradle files ==="
          find . -maxdepth 8 -type f \
            \( \
              -name 'build.gradle' \
              -o -name 'build.gradle.kts' \
              -o -name 'settings.gradle' \
              -o -name 'settings.gradle.kts' \
              -o -name 'gradle-wrapper.properties' \
              -o -name 'gradlew' \
            \) \
            -print | sort

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Java and Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Java ==="
          java -version

          echo "JAVA_HOME=$JAVA_HOME"

          echo "=== Gradle ==="

          if [[ -x "./gradlew" ]]; then
            ./gradlew --version
          else
            gradle --version
          fi

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Checking Android app module ==="

          if [[ ! -d "app" ]]; then
            echo "::error::The app module was not found."

            echo "=== Project directories ==="
            find . -maxdepth 5 -type d -print | sort

            exit 1
          fi

          echo "=== Building Debug APK ==="

          if [[ -x "./gradlew" ]]; then
            chmod +x ./gradlew

            ./gradlew \
              :app:assembleDebug \
              --no-daemon \
              --stacktrace \
              --warning-mode all
          else
            gradle \
              :app:assembleDebug \
              --no-daemon \
              --stacktrace \
              --warning-mode all
          fi

      - name: Find generated APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=== APK files ==="

          find app/build/outputs \
            -type f \
            -name '*.apk' \
            -print | sort

          APK=""

          while IFS= read -r apk_file; do
            APK="$apk_file"
            break
          done < <(
            find app/build/outputs \
              -type f \
              -name '*debug*.apk' \
              -print | sort
          )

          if [[ -z "$APK" ]]; then
            while IFS= read -r apk_file; do
              APK="$apk_file"
              break
            done < <(
              find app/build/outputs \
                -type f \
                -name '*.apk' \
                -print | sort
            )
          fi

          if [[ -z "$APK" ]]; then
            echo "::error::No APK was generated."

            echo "=== Build outputs ==="
            find app/build/outputs \
              -maxdepth 10 \
              -type f \
              -print 2>/dev/null | sort || true

            exit 1
          fi

          echo "APK found: $APK"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk-output/AI-Video-Studio-v1-debug.apk"

          echo "=== Final APK ==="

          ls -lh \
            "$GITHUB_WORKSPACE/apk-output/AI-Video-Studio-v1-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Studio-v1-APK
          path: apk-output/AI-Video-Studio-v1-debug.apk
          if-no-files-found: error
          retention-days: 14
