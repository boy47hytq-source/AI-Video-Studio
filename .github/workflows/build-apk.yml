name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check repository
        shell: bash
        run: |
          set -e

          echo "=== Repository files ==="
          ls -lah

          if [ ! -f "AI-Video-Studio-v1.zip" ]; then
            echo "::error::AI-Video-Studio-v1.zip was not found."
            exit 1
          fi

          echo
          echo "=== ZIP contents ==="
          unzip -l "AI-Video-Studio-v1.zip" | head -120

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project

          unzip -o "AI-Video-Studio-v1.zip" -d project

          echo
          echo "=== Extracted files ==="
          find project -maxdepth 5 -type f | sort | head -200

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          SETTINGS_FILE="$(find project -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) | head -n 1)"

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            BUILD_FILE="$(find project -type f \( \
              -name "build.gradle" -o \
              -name "build.gradle.kts" \
            \) | head -n 1)"

            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR="$(dirname "$BUILD_FILE")"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android Gradle project was not found."
            find project -maxdepth 6 -type f | sort
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show Android project
        shell: bash
        run: |
          set -e

          echo "=== Project directory ==="
          echo "$PROJECT_DIR"

          echo
          echo "=== Project files ==="
          find "$PROJECT_DIR" -maxdepth 4 -type f | sort | head -250

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            sed -i 's/\r$//' ./gradlew
            ./gradlew --version
          else
            gradle --version
          fi

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=== Configure JVM 17 ==="

          cat > jvm17.init.gradle <<'EOF'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  options.release = 17
              }
          }
          EOF

          echo "=== Building Debug APK ==="

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            sed -i 's/\r$//' ./gradlew
            ./gradlew --init-script jvm17.init.gradle :app:assembleDebug --no-daemon --stacktrace --warning-mode all
          else
            gradle --init-script jvm17.init.gradle :app:assembleDebug --no-daemon --stacktrace --warning-mode all
          fi
      - name: Find generated APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=== APK files ==="
          find . -type f -name "*.apk" -print

          APK="$(find app/build/outputs -type f -name "*.apk" | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::No APK was generated."
            find app/build/outputs -maxdepth 6 -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "APK found: $APK"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/AI-Video-Studio-V1-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Studio-V1-APK
          path: apk-output/AI-Video-Studio-V1-debug.apk
          if-no-files-found: error
          retention-days: 14
