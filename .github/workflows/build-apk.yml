name: Build Android APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
name: Build Debug APK
runs-on: ubuntu-latest
timeout-minutes: 30

steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Check repository
    shell: bash
    run: |
      set -e

      echo "=== Repository files ==="
      ls -lah

      echo
      echo "=== ZIP file ==="
      if [ ! -f "AI-Video-Studio-v1.zip" ]; then
        echo "::error::AI-Video-Studio-v1.zip was not found."
        exit 1
      fi

      ls -lh "AI-Video-Studio-v1.zip"

      echo
      echo "=== ZIP contents ==="
      unzip -l "AI-Video-Studio-v1.zip" | head -120

  - name: Extract Android project
    shell: bash
    run: |
      set -e

      rm -rf project
      mkdir -p project

      unzip -o "AI-Video-Studio-v1.zip" -d project

      echo
      echo "=== Extracted project ==="
      find project -maxdepth 5 -type f | sort | head -200

  - name: Find Android project
    shell: bash
    run: |
      set -e

      PROJECT_DIR=""

      echo "=== Searching for Gradle Android project ==="

      # Prefer a directory containing settings.gradle / settings.gradle.kts.
      SETTINGS_FILE="$(find project -type f \
        -name "settings.gradle" -o \
        -name "settings.gradle.kts" \
        | head -n 1)"

      if [ -n "$SETTINGS_FILE" ]; then
        PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
      fi

      # Fallback: search for a root build.gradle file.
      if [ -z "$PROJECT_DIR" ]; then
        BUILD_FILE="$(find project -type f \
          -name "build.gradle" -o \
          -name "build.gradle.kts" \
        | head -n 1)"

        if [ -n "$BUILD_FILE" ]; then
          PROJECT_DIR="$(dirname "$BUILD_FILE")"
        fi
      fi

      if [ -z "$PROJECT_DIR" ]; then
        echo "::error::Android Gradle project was not found."
        echo
        echo "Files inside extracted project:"
        find project -maxdepth 6 -type f | sort
        exit 1
      fi

      echo "Android project found:"
      echo "$PROJECT_DIR"

      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

  - name: Show Android project
    shell: bash
    run: |
      set -e

      echo "=== Project directory ==="
      echo "$PROJECT_DIR"

      echo
      echo "=== Project files ==="
      find "$PROJECT_DIR" -maxdepth 4 -type f | sort | head -250

      echo
      echo "=== Gradle files ==="
      find "$PROJECT_DIR" -maxdepth 3 -type f \
        -name "gradlew" -o \
        -name "gradle-wrapper.properties" -o \
        -name "settings.gradle" -o \
        -name "settings.gradle.kts" -o \
        -name "build.gradle" -o \
        -name "build.gradle.kts" \
      -print

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Prepare Gradle
    working-directory: ${{ env.PROJECT_DIR }}
    shell: bash
    run: |
      set -e

      echo "=== Preparing Gradle ==="

      if [ -f "./gradlew" ]; then
        echo "Gradle Wrapper found."
        chmod +x ./gradlew

        # Fix possible Windows line endings in the wrapper.
        sed -i 's/\r$//' ./gradlew

        echo
        echo "=== Gradle Wrapper version ==="
        ./gradlew --version
      else
        echo "Gradle Wrapper not found."
        echo "A compatible Gradle version will be supplied by GitHub Actions."

        gradle --version
      fi

  - name: Clean project
    working-directory: ${{ env.PROJECT_DIR }}
    shell: bash
    run: |
      set -e

      if [ -f "./gradlew" ]; then
        ./gradlew clean --no-daemon
      else
        gradle clean --no-daemon
      fi

  - name: Build Debug APK
    working-directory: ${{ env.PROJECT_DIR }}
    shell: bash
    run: |
      set -e

      echo "=== Building Debug APK ==="

      if [ ! -d "app" ]; then
        echo "::error::The Android app module 'app' was not found."
        echo
        echo "Project structure:"
        find . -maxdepth 3 -type d | sort
        exit 1
      fi

      if [ -f "./gradlew" ]; then
        ./gradlew :app:assembleDebug \
          --no-daemon \
          --stacktrace \
          --warning-mode all
      else
        gradle :app:assembleDebug \
          --no-daemon \
          --stacktrace \
          --warning-mode all
      fi

  - name: Find generated APK
    working-directory: ${{ env.PROJECT_DIR }}
    shell: bash
    run: |
      set -e

      echo "=== Searching for APK ==="

      find . -type f -name "*.apk" -print

      APK="$(find app/build/outputs -type f -name "*.apk" | head -n 1)"

      if [ -z "$APK" ]; then
        echo "::error::No APK was generated."
        echo
        echo "Build output directory:"
        find app/build/outputs -maxdepth 6 -type f -print 2>/dev/null || true
        exit 1
      fi

      echo
      echo "APK found:"
      echo "$APK"

      mkdir -p "$GITHUB_WORKSPACE/apk-output"

      cp "$APK" \
        "$GITHUB_WORKSPACE/apk-output/AI-Video-Studio-V1-debug.apk"

      echo
      echo "APK prepared for upload:"
      ls -lh "$GITHUB_WORKSPACE/apk-output/"

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: AI-Video-Studio-V1-APK
      path: apk-output/AI-Video-Studio-V1-debug.apk
      if-no-files-found: error
      retention-days: 14
