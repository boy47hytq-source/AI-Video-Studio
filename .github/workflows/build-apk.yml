name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify project
        shell: bash
        run: |
          set -e

          echo "=== Java ==="
          java -version

          echo "=== Gradle ==="
          gradle --version

          echo "=== Android project ==="
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts

          echo "Project detected successfully."

      - name: Fix Java/Kotlin JVM target
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path("project/app/build.gradle.kts")
          text = path.read_text()

          compile_block = """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """

          if "sourceCompatibility = JavaVersion.VERSION_17" not in text:
              marker = "android {"
              if marker not in text:
                  raise SystemExit("android { block not found")

              text = text.replace(
                  marker,
                  marker + "\n" + compile_block,
                  1
              )

          if 'jvmTarget = "17"' not in text:
              android_end = None
              depth = 0
              start = text.find("android {")

              if start == -1:
                  raise SystemExit("android block not found")

              for i in range(start, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          android_end = i + 1
                          break

              if android_end is None:
                  raise SystemExit("Could not find end of android block")

              kotlin_block = """

          kotlinOptions {
              jvmTarget = "17"
          }
          """

              text = text[:android_end] + kotlin_block + text[android_end:]

          path.write_text(text)
          PY

          echo "=== Patched app/build.gradle.kts ==="
          sed -n '1,180p' project/app/build.gradle.kts

      - name: Check Gradle configuration
        working-directory: project
        shell: bash
        run: |
          set -e
          gradle tasks --no-daemon

      - name: Build Debug APK
        working-directory: project
        shell: bash
        run: |
          set -e

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      - name: Locate APK
        shell: bash
        run: |
          set -e

          echo "=== Generated APK files ==="

          find project/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find project/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          cp "$APK" "AI-Video-Studio-debug.apk"

          echo "APK: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Studio-debug
          path: AI-Video-Studio-debug.apk
          if-no-files-found: error
          retention-days: 14
